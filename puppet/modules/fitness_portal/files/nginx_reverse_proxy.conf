# Nginx Reverse Proxy Configuration for Fitness Equipment Maintenance Portal
# Proxies public HTTP traffic on port 80 to Spring Boot backend on 127.0.0.1:8080

upstream fitness_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Static Assets Caching
    location /css/ {
        proxy_pass http://fitness_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /js/ {
        proxy_pass http://fitness_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Healthcheck bypass
    location /actuator/health {
        proxy_pass http://fitness_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Application Gateway Proxy
    location / {
        proxy_pass http://fitness_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
