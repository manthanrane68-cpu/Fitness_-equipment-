spring.application.name=fitness-equipment-portal
server.port=8080

# H2 In-Memory Database for rapid CI/CD, local dev and automated tests
spring.datasource.url=jdbc:h2:mem:fitnessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Thymeleaf Template Cache disabled for development
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
